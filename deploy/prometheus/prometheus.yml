# Prometheus scrapes the API's and the worker's /metrics every five seconds (docs/adr/0026, 0035).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:8080']
  - job_name: worker
    static_configs:
      - targets: ['worker:9090']
