openapi: 3.1.0
info:
  title: Notification API
  version: 0.1.0
  summary: Accepts notifications and reports their delivery over SMS, e-mail and push.
  description: |
    Notifications are accepted here and delivered asynchronously by workers through an external provider
    (docs/adr). This file is the API's contract, written by hand (design first) and changed in the same commit
    as the behaviour it describes.

    Every error answer is `application/problem+json` (RFC 9457) with a stable `code`, the request's
    `correlationId`, and, for invalid requests, `errors` located by JSON Pointer.

    Every request may carry `X-Correlation-ID` (1 to 128 visible ASCII characters); every answer carries the ID
    the request was handled under, the client's or a new one. A notification keeps the ID of the request that created
    it: the worker logs its sends under it, and sends it to the provider in the same header.
servers:
  - url: http://localhost:8080
    description: the local stack

paths:
  /v1/notifications:
    post:
      operationId: createNotification
      summary: Accept a notification for sending
      description: |
        Validates the notification, stores it as `queued` and answers at once; a worker sends it later. The
        answer is `202 Accepted` because the notification is accepted, not yet sent: follow `Location` to see
        its status.

        With an `Idempotency-Key`, repeating the request returns the first notification, marked with
        `Idempotent-Replayed: true`, however much later it is repeated. The same key with a different request is
        refused with `422 idempotency_key_reused`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
            example:
              to: '+905551234567'
              channel: sms
              content: Your order has shipped.
              priority: high
      responses:
        '202':
          description: Accepted for sending, or a repeat of an accepted request.
          headers:
            Location:
              description: The notification's URL.
              schema: { type: string, example: /v1/notifications/0193a8f2-7c1e-7b3a-9d4e-2f1a3b4c5d6e }
            Idempotent-Replayed:
              description: Present, as `true`, when the request repeats an earlier one with the same key.
              schema: { type: string, enum: ['true'] }
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: >-
            The body is not valid JSON (`invalid_json`), has a member the request does not define
            (`unknown_field`), or the `Idempotency-Key` header is malformed (`invalid_idempotency_key`).
          $ref: '#/components/responses/Problem'
        '413':
          description: The body is larger than 1 MiB (`body_too_large`).
          $ref: '#/components/responses/Problem'
        '415':
          description: The body is not sent as `application/json` (`unsupported_media_type`).
          $ref: '#/components/responses/Problem'
        '422':
          description: >-
            The notification breaks a rule (`validation_failed`, with `errors`), or the idempotency key was used for
            a different request (`idempotency_key_reused`).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

    get:
      operationId: listNotifications
      summary: List notifications, newest first, a page at a time
      description: |
        Filters combine with AND; `status` and `channel` may be given several times and then match any of their
        values. Pages are ordered newest first and follow each other by cursor: pass `nextCursor` from a page as
        `cursor` to get the next, with the same filters. A cursor is opaque. An unknown parameter is refused, so a
        misspelt filter does not list everything.
      parameters:
        - name: status
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Status' } }
          style: form
          explode: true
        - name: channel
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Channel' } }
          style: form
          explode: true
        - name: batchId
          in: query
          schema: { type: string, format: uuid }
        - name: createdFrom
          in: query
          description: Created at or after this time (RFC 3339, with its offset).
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          description: Created before this time.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: A page of notifications.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: A parameter is unknown or malformed (`invalid_query`, with `errors` naming each `parameter`).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

  /v1/notifications/{id}:
    get:
      operationId: getNotification
      summary: Read a notification and its status
      parameters:
        - $ref: '#/components/parameters/NotificationID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: The notification.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          description: No notification has this ID, or the ID is not a UUID (`not_found`).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

  /v1/notifications/{id}/cancel:
    post:
      operationId: cancelNotification
      summary: Cancel a notification that is still waiting
      description: |
        A `scheduled`, `queued` or `retrying` notification is cancelled; a worker that has already claimed it wins,
        and the cancel is refused. Cancelling a cancelled notification answers it again, so the request is safe to
        repeat.
      parameters:
        - $ref: '#/components/parameters/NotificationID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: The notification, cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          description: No notification has this ID (`not_found`).
          $ref: '#/components/responses/Problem'
        '409':
          description: The notification is being sent or is finished (`not_cancellable`; `detail` names its status).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

  /v1/notifications/{id}/retry:
    post:
      operationId: retryNotification
      summary: Send a failed notification again
      description: The notification goes back to `queued` with a fresh set of attempts.
      parameters:
        - $ref: '#/components/parameters/NotificationID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '202':
          description: The notification, queued again.
          headers:
            Location:
              description: The notification's URL.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          description: No notification has this ID (`not_found`).
          $ref: '#/components/responses/Problem'
        '409':
          description: The notification is not failed (`not_retryable`; `detail` names its status).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

  /v1/notifications/retry:
    post:
      operationId: retryFailedNotifications
      summary: Send failed notifications again in bulk
      description: |
        Puts the failed notifications that failed inside the window, optionally of one channel or batch, back in
        the queue, oldest failure first, at most 10,000 per request; repeat the request for the rest while
        `matched` exceeds `requeued`. A dry run only counts.
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
            example: { channel: sms, failedFrom: '2026-11-23T10:00:00Z', failedTo: '2026-11-23T11:00:00Z', dryRun: true }
      responses:
        '200':
          description: A dry run; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryResult'
        '202':
          description: The notifications requeued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryResult'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          description: The window is missing or empty, or the channel unknown (`validation_failed`).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

  /v1/metrics:
    get:
      operationId: getMetricsSummary
      summary: The service's state as a person reads it
      description: |
        Notifications waiting now, by channel and status, and how sending went over the last five minutes: attempts by
        outcome, the success rate, and the provider's latency percentiles. Computed from the database, so every replica
        answers the same. Prometheus scrapes `/metrics` on the API (port 8080) and the worker (port 9090) instead.
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummary'
        '500':
          $ref: '#/components/responses/Problem'

  /healthz:
    get:
      operationId: getLiveness
      summary: Whether the process runs
      description: |
        Answers 200 while the process runs, whatever the state of its dependencies, since restarting it would not
        bring a database back (ADR 0027). For a liveness probe. The worker serves the same on its operations port
        (9090). A successful call is logged at debug level only.
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: The process runs.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      operationId: getReadiness
      summary: Whether the process can do its work
      description: |
        Checks every dependency at once, each within two seconds: PostgreSQL for the API; PostgreSQL and RabbitMQ for
        the worker, on its operations port (9090). For a readiness probe; the containers' health checks run it
        through `api healthcheck` and `worker healthcheck` (ADR 0027). Why a dependency failed is logged, never
        answered, since the error can hold a host or a user name. A successful call is logged at debug level only.
      parameters:
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: Every dependency answered.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, const: ready }
                  checks:
                    type: object
                    description: Each dependency checked, by name.
                    additionalProperties: { type: string, const: ok }
              example: { status: ready, checks: { postgres: ok } }
        '503':
          description: |
            A dependency did not answer: `code` is `not_ready` and `detail` names the dependencies, such as
            "postgres did not answer".
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Metrics in Prometheus's text format
      description: |
        For Prometheus to scrape (ADR 0026): HTTP requests by method, route and status, their latency, and the Go
        runtime's and the process's metrics. The worker serves its own on its operations port (9090): attempts,
        provider latency, breaker state, queue depths and more. People read `GET /v1/metrics` instead. A successful
        call is logged at debug level only.
      responses:
        '200':
          description: The metrics.
          content:
            text/plain:
              schema: { type: string }

  /v1/batches:
    post:
      operationId: createBatch
      summary: Accept up to 1000 notifications at once
      description: |
        Each item is validated on its own. The valid items are stored as `queued` notifications, in one
        transaction, and the invalid ones are reported with their position and reasons: one invalid item does not
        refuse the others. The answer is `202` while at least one item is accepted, and `422` when none is, in
        which case nothing is stored.

        The answer lists the ID each accepted item was given, by its position in the request. The batch keeps
        the rejected items' positions and reasons, never their content, and shows them when read.

        An `Idempotency-Key` covers the whole batch: repeating the request returns the first batch, marked
        `Idempotent-Replayed: true`. Batch keys and notification keys are separate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
            example:
              notifications:
                - { to: '+905551234567', channel: sms, content: 'Flash sale: 40% off until midnight.' }
                - { to: '05551234567', channel: sms, content: 'Flash sale: 40% off until midnight.' }
                - { to: ayse@example.com, channel: email, content: 'Flash sale: 40% off until midnight.', priority: high }
      responses:
        '202':
          description: At least one item was accepted; the rejected ones are listed.
          headers:
            Location:
              description: The batch's URL.
              schema: { type: string, example: /v1/batches/0193a8f2-7c1e-7b3a-9d4e-2f1a3b4c5d70 }
            Idempotent-Replayed:
              description: Present, as `true`, when the request repeats an earlier one with the same key.
              schema: { type: string, enum: ['true'] }
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          description: >-
            The body is not valid JSON (`invalid_json`), has a member the request does not define
            (`unknown_field`), or the `Idempotency-Key` header is malformed (`invalid_idempotency_key`).
          $ref: '#/components/responses/Problem'
        '413':
          description: The body is larger than the batch limit, 10 MiB by default (`body_too_large`).
          $ref: '#/components/responses/Problem'
        '415':
          description: The body is not sent as `application/json` (`unsupported_media_type`).
          $ref: '#/components/responses/Problem'
        '422':
          description: >-
            No item is valid, or the batch is empty or holds more than 1000 items (`validation_failed`, with
            `errors` such as `/notifications/3/to`), or the idempotency key was used for a different batch
            (`idempotency_key_reused`).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

  /v1/batches/{id}:
    get:
      operationId: getBatch
      summary: Read a batch, its notifications counted by status
      parameters:
        - $ref: '#/components/parameters/BatchID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: The batch, with `statuses` counting its notifications by their status now.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '404':
          description: No batch has this ID, or the ID is not a UUID (`not_found`).
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

components:
  parameters:
    NotificationID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key the client chooses for the request, unique to it, such as `order-42-sms`. It never expires.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: '^[!-~]+$' }
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: An ID that joins the logs of everything this request causes; a new one is made when absent or invalid.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }

  headers:
    CorrelationID:
      description: The correlation ID the request was handled under.
      schema: { type: string }

  responses:
    Problem:
      description: An error, as RFC 9457 describes it.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
      description: Orders waiting work within a channel; it is not sent to the provider.
    Status:
      type: string
      enum: [scheduled, queued, sending, retrying, sent, failed, cancelled]
      description: |
        `scheduled` and `queued` wait; `sending` is with a worker; `retrying` waits for its next attempt;
        `sent`, `failed` and `cancelled` are where a notification ends (a failed one can be retried).

    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [to, channel, content]
      properties:
        to:
          type: string
          description: The recipient, in the form the channel requires (below). It is never reformatted.
        channel:
          $ref: '#/components/schemas/Channel'
        content:
          type: string
          minLength: 1
          description: >-
            The message, counted in characters, not bytes. It must not be blank and must not contain the NUL
            character.
        priority:
          $ref: '#/components/schemas/Priority'
          default: normal
      allOf:
        - if: { properties: { channel: { const: sms } } }
          then:
            properties:
              to: { pattern: '^\+[1-9][0-9]{1,14}$', description: 'E.164, such as +905551234567' }
              content: { maxLength: 1600 }
        - if: { properties: { channel: { const: email } } }
          then:
            properties:
              to: { format: email, maxLength: 254, description: 'one address, without a display name' }
              content: { maxLength: 100000 }
        - if: { properties: { channel: { const: push } } }
          then:
            properties:
              to: { pattern: '^[!-~]{1,512}$', description: 'a device token of visible ASCII characters' }
              content: { maxLength: 1000 }

    Notification:
      type: object
      required: [id, to, channel, content, priority, status, correlationId, attempts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, description: 'A version 7 UUID; it sorts by creation time.' }
        to: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        content: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        correlationId: { type: string }
        batchId: { type: string, format: uuid, description: 'The batch it came in, when it came in one.' }
        failedAt: { type: string, format: date-time, description: 'When it failed, while it is failed (UTC).' }
        attempts: { type: integer, description: 'Attempts spent since it was created or last retried by hand.' }
        failureReason:
          type: string
          enum: [provider_rejected, attempts_exhausted, unprocessable_message]
          description: Why it failed, while it is failed.
        providerMessageId: { type: string, description: "The provider's ID for the message, once sent." }
        createdAt: { type: string, format: date-time, description: 'UTC' }
        updatedAt: { type: string, format: date-time, description: 'UTC' }

    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor:
          type: string
          description: Absent on the last page; pass it as `cursor` for the next one.

    RetryRequest:
      type: object
      additionalProperties: false
      required: [failedFrom, failedTo]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        batchId: { type: string, format: uuid }
        failedFrom: { type: string, format: date-time, description: 'Failed at or after this time.' }
        failedTo: { type: string, format: date-time, description: 'Failed before this time.' }
        dryRun: { type: boolean, default: false }

    RetryResult:
      type: object
      required: [matched, requeued, dryRun]
      properties:
        matched: { type: integer, description: 'Failed notifications the filter selects.' }
        requeued: { type: integer, description: 'Put back in the queue by this request; 0 on a dry run.' }
        dryRun: { type: boolean }

    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          description: Each item is validated as a single create's body is; invalid items are reported, not fatal.
          items:
            $ref: '#/components/schemas/CreateNotificationRequest'

    Batch:
      type: object
      required: [id, total, accepted, rejected, rejections, correlationId, createdAt]
      properties:
        id: { type: string, format: uuid }
        total: { type: integer, description: 'Items in the request.' }
        accepted: { type: integer, description: 'Items stored as notifications.' }
        rejected: { type: integer, description: 'Items refused; total = accepted + rejected.' }
        notifications:
          type: array
          description: In the answer to a create only; the ID each accepted item was given.
          items:
            type: object
            required: [index, id]
            properties:
              index: { type: integer, description: 'The position in the request, counted from zero.' }
              id: { type: string, format: uuid }
        statuses:
          type: object
          description: When the batch is read only; its notifications counted by their status now.
          propertyNames: { $ref: '#/components/schemas/Status' }
          additionalProperties: { type: integer }
          example: { queued: 980, sent: 18 }
        rejections:
          type: array
          items:
            type: object
            required: [index, errors]
            properties:
              index: { type: integer, description: 'The position in the request, counted from zero.' }
              errors:
                type: array
                items: { $ref: '#/components/schemas/FieldProblem' }
        correlationId: { type: string }
        createdAt: { type: string, format: date-time, description: 'UTC' }

    MetricsSummary:
      type: object
      required: [generatedAt, windowSeconds, channels]
      properties:
        generatedAt: { type: string, format: date-time }
        windowSeconds: { type: integer, description: 'How far back attempts are counted: 300.' }
        channels:
          type: object
          propertyNames: { $ref: '#/components/schemas/Channel' }
          additionalProperties: { $ref: '#/components/schemas/ChannelSummary' }

    ChannelSummary:
      type: object
      required: [waiting, attempts, successRate, latencyMs]
      properties:
        waiting:
          type: object
          description: Notifications not yet finished, by status.
          required: [scheduled, queued, retrying, sending]
          properties:
            scheduled: { type: integer }
            queued: { type: integer }
            retrying: { type: integer }
            sending: { type: integer }
        attempts:
          type: object
          description: The window's attempts by outcome.
          required: [success, permanent, permanentAlert, transient, unknown]
          properties:
            success: { type: integer }
            permanent: { type: integer }
            permanentAlert: { type: integer }
            transient: { type: integer }
            unknown: { type: integer }
        successRate:
          type: [number, 'null']
          description: Successful attempts over all of the window's attempts; null when there were none.
          example: 0.9975
        latencyMs:
          type: [object, 'null']
          description: The provider's latency over the window's answered attempts; null when there were none.
          properties:
            p50: { type: number }
            p95: { type: number }
            p99: { type: number }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: 'Always about:blank; `code` names the problem.' }
        title: { type: string, description: 'The HTTP status text.' }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable and machine-readable; clients switch on it, never on `detail`.
          examples: [validation_failed, idempotency_key_reused, not_found, invalid_json, internal_error]
        correlationId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldProblem' }

    FieldProblem:
      type: object
      description: A body member, located by `pointer`, or a query parameter, named by `parameter`.
      required: [code, detail]
      properties:
        pointer: { type: string, description: 'A JSON Pointer to the member, such as /to.', example: /to }
        parameter: { type: string, description: 'The query parameter, such as status.', example: status }
        code: { type: string, enum: [required, invalid, too_long] }
        detail: { type: string }
