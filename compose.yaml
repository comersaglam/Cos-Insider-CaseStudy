# The whole service in one command (docs/adr/0010, 0019, 0025): `docker compose up` builds the image, starts
# PostgreSQL, RabbitMQ and a stand-in provider, applies the migrations, then serves the API on
# http://localhost:8080 and runs the worker, which sends to the stand-in unless PROVIDER_URL names a real provider,
# such as a webhook.site URL. `--wait` returns once every service is healthy (ADR 0027).
# Tests do not use this file; they start their own containers from the same images, which
# internal/platform/testenv names and a test keeps equal to the tags below.

name: notifications

# The application's settings, shared by every service that runs the image.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Spans go to Jaeger (ADR 0034); remove it to export none.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-app: &app
  build: .
  image: notifications:local
  environment: *app-env

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # From PostgreSQL 18 the image keeps its data under a versioned directory below this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP, because the server the image runs while initialising listens only on a Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.4.1-management-alpine
    # RabbitMQ names its node, and the data stored under it, after the host name; a fixed one keeps the data
    # across container re-creation.
    hostname: rabbitmq
    # The health check runs as the container's user. As root, its first run could create the Erlang cookie
    # before the server does, readable by root alone, and the server, running as rabbitmq, would fail to start.
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-notifications}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-notifications}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Passes only once the AMQP listener accepts connections, not merely when the node process is up.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Applies the migrations, then exits; the services that use the database wait for it (ADR 0016).
  migrate:
    <<: *app
    command: ["api", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # Healthy once /readyz answers (ADR 0027); the image has no shell or curl, so the binary asks itself.
    healthcheck:
      test: ["CMD", "api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Relays, schedules and sends (ADR 0009). Stopped, it finishes the sends in flight; failed, it is restarted, and
  # RabbitMQ delivers again what it had not acknowledged.
  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      AMQP_URL: amqp://${RABBITMQ_USER:-notifications}:${RABBITMQ_PASSWORD:-notifications}@rabbitmq:5672/
      PROVIDER_URL: ${PROVIDER_URL:-http://provider:8080/notify}
    # The operations server: /metrics for Prometheus, /healthz and /readyz.
    ports:
      - "127.0.0.1:${WORKER_OPS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      provider:
        condition: service_started
    restart: unless-stopped

  # A stand-in for the provider (ADR 0025): WireMock answers 202 as the brief's webhook.site does, and 503 or 422 for
  # two demonstration numbers. Its admin API lists what it received: http://localhost:8081/__admin/requests
  provider:
    image: wiremock/wiremock:3.13.2-3
    volumes:
      - ./deploy/wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      - "127.0.0.1:${PROVIDER_PORT:-8081}:8080"

  # Traces (ADR 0034): Jaeger receives the API's and the worker's spans over OTLP/HTTP on 4318, inside the network, and
  # shows them at http://localhost:16686. It keeps them in memory: a restart forgets them.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

  # Metrics and dashboards (ADR 0035): Prometheus scrapes both processes, and Grafana shows them on a provisioned
  # dashboard at http://localhost:3000, open to anonymous viewers on this machine.
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/notifications.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
